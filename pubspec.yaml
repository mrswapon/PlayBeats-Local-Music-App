name: play_beats
description: "PlayBeats - Local music player app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  audio_session: ^0.1.25

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5
  provider: ^6.1.2
  video_thumbnail: ^0.5.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Local Music
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  device_info_plus: ^11.1.0

  # UI
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
